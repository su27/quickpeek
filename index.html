<!doctype html>
<html lang="en" style="background: #202020">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#202020" />
    <title>QuickPeek</title>
  </head>
  <body>
    <div id="app">
      <div class="tool-strip">
        <div class="search-control" id="searchControl">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="8.5" cy="8.5" r="4.8" />
            <path d="m12 12 4 4" />
          </svg>
          <input id="searchInput" type="search" placeholder="Find in document" aria-label="Find in document" autocomplete="off" disabled />
          <span id="searchCount" class="search-count" aria-live="polite"></span>
          <button id="previousMatch" class="inline-icon" type="button" title="Previous match (Shift+Enter)" aria-label="Previous match" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5.5 12.5 4.5-5 4.5 5" /></svg>
          </button>
          <button id="nextMatch" class="inline-icon" type="button" title="Next match (Enter)" aria-label="Next match" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5.5 7.5 4.5 5 4.5-5" /></svg>
          </button>
        </div>

      </div>

      <main id="workspace" class="workspace">
        <div id="dropOverlay" class="drop-overlay" aria-hidden="true">
          <div class="drop-card">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <path d="M8 4h10l6 6v18H8z" />
              <path d="M18 4v6h6M16 22V13M12.5 16.5 16 13l3.5 3.5" />
            </svg>
            <strong>Drop to preview</strong>
            <span>Preview documents, media, archives, and other files</span>
          </div>
        </div>

        <div id="documentViewport" class="document-viewport" aria-label="File preview">
          <article id="documentHost" class="document-host"></article>
        </div>

        <div id="toast" class="toast" role="status" aria-live="polite"></div>
      </main>

      <input id="fileInput" type="file" hidden />
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
